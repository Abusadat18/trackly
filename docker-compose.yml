services:
  db:
    image: postgres:16-alpine
    container_name: trackly-db
    environment:
      POSTGRES_USER: trackly
      POSTGRES_PASSWORD: trackly_secret
      POSTGRES_DB: trackly
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackly"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: trackly-api
    environment:
      DATABASE_URL: postgresql://trackly:trackly_secret@db:5432/trackly
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-change-me}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: trackly-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: trackly-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ollama-init:
    image: curlimages/curl:latest
    container_name: trackly-ollama-init
    depends_on:
      - ollama
        
    entrypoint:
      [
        "sh",
        "-c",
        "
        echo 'Waiting for Ollama to start...' &&

        until curl -s http://ollama:11434/api/tags > /dev/null; do
          echo 'Ollama not ready yet...';
          sleep 2;
        done &&

        echo 'Ollama is ready.' &&
        echo 'Downloading llama3.2:3b model (first startup may take several minutes)...' &&

        curl http://ollama:11434/api/pull \
        -H 'Content-Type: application/json' \
        -d '{\"name\":\"llama3.2:3b\"}' &&

        echo 'Model ready.'
        "
      ]

    restart: "no"

volumes:
  pgdata:
  ollama_data:
