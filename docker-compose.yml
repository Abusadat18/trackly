services:
  db:
    image: postgres:16-alpine
    container_name: trackly-db
    environment:
      POSTGRES_USER: trackly
      POSTGRES_PASSWORD: trackly_secret
      POSTGRES_DB: trackly
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackly"]
      interval: 5s
      timeout: 5s
      retries: 5

